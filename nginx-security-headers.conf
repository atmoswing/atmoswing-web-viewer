# Security headers, included by nginx.conf at server level AND inside every location that sets
# its own add_header: nginx drops inherited add_header directives in any location that declares
# one, so a header set only at server level silently disappears there.
#
# `always` keeps them on error responses (404, 500) too.

# Stop browsers guessing a content type other than the one declared.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin, not the full URL (which carries ?workspace=), to other sites such as
# map tile providers and the API.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Only pages on this same origin may embed the viewer in a frame. frame-ancestors is the modern
# control; X-Frame-Options covers older browsers. This policy restricts nothing but framing.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
